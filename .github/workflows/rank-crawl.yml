name: KBO team rank crawl

# 경기일 순위는 game-watch.yml / lineup-crawl.yml이 경기 결과와 함께 갱신한다.
# 이 워크플로는 하루 한 번 안전망이다.
on:
  schedule:
    - cron: '17 1 * * *'         # 10:17 KST 안전망
  workflow_dispatch:

concurrency:
  group: kbo-lineup-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - name: Install Python dependencies
        run: pip install -r requirements-crawler.txt

      - name: Run team rank crawler
        run: python public/kbo_team_rank_crawler.py

      - name: Commit and push
        id: commit
        run: scripts/ci/commit-and-push.sh "Update team ranks" public/data/teamRank.json

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
