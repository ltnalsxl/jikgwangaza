name: KBO 30-day schedule crawl

# 앞으로 30일 경기 일정(우천 재편성 포함)과 발표된 예고 선발을 하루 두 번 갱신한다.
on:
  schedule:
    - cron: '53 0,9 * * *'  # 09:53, 18:53 KST
  workflow_dispatch:

concurrency:
  group: kbo-lineup-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - name: Install Python dependencies
        run: pip install -r requirements-crawler.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Crawl next 30 days
        env:
          TZ: Asia/Seoul
        run: |
          python public/kbo_crawler.py --mode range \
            --start-date "$(date -d '+2 days' +%F)" --end-date "$(date -d '+30 days' +%F)" \
            --save_dir public/data/kbo_crawler_data --no-selenium

      - name: Rebuild lineup index & season bundles
        run: node scripts/generateLineupIndex.js

      - name: Commit and push
        id: commit
        run: scripts/ci/commit-and-push.sh "Update 30-day schedule" public/data/kbo_crawler_data

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
