name: KBO live game watcher

# 경기 결과와 순위를 경기 종료 직후 몇 분 안에 반영한다.
# GitHub cron은 수십 분~수 시간 밀리므로, 잡 하나가 시작되면 scripts/watch_games.py가
# 3~12분 간격으로 직접 반복하면서 바뀔 때마다 커밋하고 deploy.yml을 요청한다.
# 오늘 경기가 모두 끝나거나(종료/취소) 멈추고, 5시간 30분이 지나도 안 끝났으면 자기 자신을
# 다시 실행해 이어간다(잡 최대 6시간 제한). 이 잡이 도는 동안 lineup-crawl은 건너뛰어서
# 같은 파일을 동시에 쓰지 않는다.
on:
  schedule:
    - cron: '13 4 * * *'   # 13:13 KST (주말 14:00 경기, 라인업 발표)
    - cron: '43 8 * * *'   # 17:43 KST (평일 18:30 경기)
    - cron: '43 12 * * *'  # 21:43 KST (앞 잡이 밀리거나 끊겼을 때 대비)
  workflow_dispatch:

concurrency:
  group: kbo-live-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - name: Install Python dependencies
        run: pip install -r requirements-crawler.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Watch today's games
        env:
          TZ: Asia/Seoul
          GH_TOKEN: ${{ github.token }}
        run: python scripts/watch_games.py --max-minutes 330 --chain
