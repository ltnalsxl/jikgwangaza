name: Daily KBO crawl

on:
  schedule:
    - cron: '0 6 * * *'  # 15:00 KST
    - cron: '30 6 * * *'  # 15:30 KST
    - cron: '0 7 * * *'  # 16:00 KST
    - cron: '30 7 * * *'  # 16:30 KST
    - cron: '50 7 * * 1-5'  # 16:50 KST (평일)
    - cron: '0 8 * * *'  # 17:00 KST
    - cron: '10 8 * * 1-5'  # 17:10 KST (평일)
    - cron: '30 8 * * *'  # 17:30 KST
    - cron: '40 6 * * 0,6'  # 15:40 KST (주말)
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas selenium webdriver-manager
          
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
      - name: Run crawler with retry
        run: |
          export DISPLAY=:99
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          
          # 최대 3번까지 재시도
          for i in {1..3}; do
            echo "Attempt $i of 3"
            if python public/kbo_crawler.py --mode incremental --days 1 --save_dir public/data/kbo_crawler_data; then
              echo "Crawler completed successfully"
              break
            else
              echo "Crawler failed, waiting 60 seconds before retry..."
              sleep 60
              if [ $i -eq 3 ]; then
                echo "All attempts failed"
                exit 1
              fi
            fi
          done
        
      - name: Rebuild lineup index
        run: npm run build-lineup-index
        
      - name: Commit and push
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add public/data/kbo_crawler_data kbo_crawler.log
          git commit -m "Daily lineup update and crawler log" || echo "No changes to commit"
          git pull origin main
          git push origin main
          fi
