name: KBO lineup & probable starter crawl

# 어제(최종 결과) ~ 오늘(라인업) ~ 내일(예고 선발)을 12:00~24:00 KST 동안 20분마다 수집하고
# 순위도 같이 갱신한다. GitHub cron은 정각/30분에 몰려 수 시간씩 지연·누락되므로 일부러
# 7/27/47분에 돌린다. game-watch.yml이 도는 동안에는 그쪽이 몇 분 간격으로 같은 일을 하므로 건너뛴다.
on:
  schedule:
    - cron: '7,27,47 3-14 * * *'  # 12:07 ~ 23:47 KST
    - cron: '17 16,22 * * *'      # 01:17, 07:17 KST (늦게 끝난 경기/연장 최종 반영)
  workflow_dispatch:

concurrency:
  group: kbo-lineup-data
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow game-watch.yml --status in_progress --json databaseId --jq length || echo 0)
          echo "live watcher runs: $n"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  crawl:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - name: Install Python dependencies
        run: pip install -r requirements-crawler.txt

      - name: Run crawler tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Crawl yesterday / today / tomorrow
        env:
          TZ: Asia/Seoul
        run: |
          START=$(date -d 'yesterday' +%F)
          END=$(date -d 'tomorrow' +%F)
          for i in 1 2 3; do
            if python public/kbo_crawler.py --mode range --start-date "$START" --end-date "$END" \
                 --save_dir public/data/kbo_crawler_data --no-selenium; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Rebuild lineup index & season bundles
        run: node scripts/generateLineupIndex.js

      - name: Update team ranks
        run: python public/kbo_team_rank_crawler.py || echo "::warning::rank crawl failed"

      - name: Commit and push
        id: commit
        run: scripts/ci/commit-and-push.sh "Update lineups & probable starters" public/data/kbo_crawler_data public/data/teamRank.json

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
