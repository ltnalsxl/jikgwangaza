name: Daily KBO lineup crawl

on:
  schedule:
    - cron: '0 6 * * *'   # 15:00 KST
    - cron: '30 6 * * *'  # 15:30 KST
    - cron: '0 7 * * *'   # 16:00 KST
    - cron: '30 7 * * *'  # 16:30 KST
    - cron: '50 7 * * 1-5'  # 16:50 KST (평일)
    - cron: '0 8 * * *'   # 17:00 KST
    - cron: '10 8 * * 1-5'  # 17:10 KST (평일)
    - cron: '30 8 * * *'  # 17:30 KST
    - cron: '40 6 * * 0,6'  # 15:40 KST (주말)
    - cron: '0 9 * * *'   # 18:00 KST
    - cron: '30 9 * * *'  # 18:30 KST
  workflow_dispatch:

concurrency:
  group: lineup-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas selenium webdriver-manager

      - name: Run crawler parser tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Crawl today/yesterday lineups (with retry)
        run: |
          for i in {1..3}; do
            echo "Attempt $i of 3"
            if python public/kbo_crawler.py --mode incremental --days 2 --save_dir public/data/kbo_crawler_data --no-selenium; then
              echo "Lineup crawl succeeded"
              break
            fi
            echo "Failed, retrying in 60s..."
            sleep 60
            [ $i -eq 3 ] && exit 1
          done

      - name: Crawl upcoming 30-day schedule stubs
        run: |
          START=$(date -d '+1 day' +%Y-%m-%d 2>/dev/null || date -v+1d +%Y-%m-%d)
          END=$(date -d '+30 days' +%Y-%m-%d 2>/dev/null || date -v+30d +%Y-%m-%d)
          echo "Crawling schedule stubs from $START to $END"
          python public/kbo_crawler.py --mode range --start "$START" --end "$END" \
            --save_dir public/data/kbo_crawler_data --no-selenium || echo "Schedule stub crawl skipped"

      - name: Rebuild lineup index
        run: npm run build-lineup-index

      - name: Commit and push
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add public/data/kbo_crawler_data
          git diff --cached --quiet && echo "No lineup changes to commit" && exit 0
          git commit -m "Daily lineup update"
          git pull --rebase origin main
          git push origin main
