name: Starter intel (1군 entry & news)

# 선발 예측 보강용: KBO 1군 투수 엔트리(등록/말소)와 주요 언론 선발 관련 기사.
# 엔트리 변동은 오후에 발표되고 다음 날 선발 기사는 저녁에 몰리므로 하루 세 번 돈다.
on:
  schedule:
    - cron: '33 2,8,13 * * *'  # 11:33, 17:33, 22:33 KST
  workflow_dispatch:

concurrency:
  group: starter-intel
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - name: Install Python dependencies
        run: pip install -r requirements-crawler.txt

      - name: Crawl 1군 pitcher entries (last 21 days)
        continue-on-error: true
        run: python scripts/crawl_kbo_register.py --keep-days 21

      - name: Collect starter news (Google News RSS)
        continue-on-error: true
        run: python scripts/crawl_starter_news.py

      - name: Commit and push
        id: commit
        run: >-
          scripts/ci/commit-and-push.sh "Update pitcher entries & starter news"
          public/data/kboPitcherRoster.json public/data/starterNews.json

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
