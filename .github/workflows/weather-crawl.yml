name: KBO ballpark weather

# 기상청 단기예보는 02·05·08·11·14·17·20·23시(KST)에 발표되고 약 10분 뒤 제공된다.
# UTC 기준 같은 시각 집합(9시간 차이 = 3의 배수)이므로 그대로 23분에 수집한다.
on:
  schedule:
    - cron: '23 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

concurrency:
  group: kbo-weather
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - name: Install Python dependencies
        run: pip install -r requirements-crawler.txt

      - name: Fetch short-term weather
        env:
          GOKR_WEATHER_API_KEY: ${{ secrets.GOKR_WEATHER_API_KEY }}
        run: python fetch_short_term_weather.py

      - name: Commit and push
        id: commit
        run: scripts/ci/commit-and-push.sh "Update ballpark weather" public/data/kboBallparkForecast.json

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
